<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Quên mật khẩu</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="auth-page">
<div class="auth-card">
    <h1>Quên mật khẩu</h1>
    <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
        <label>Email</label>
        <input type="email" th:field="*{email}" required>
        <button type="submit" class="button full mt">Gửi OTP</button>
    </form>
    <div class="mt"><a href="/login">Quay lại Login</a></div>
</div>
</body>
</html>
