<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Đặt lại mật khẩu</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="auth-page">
<div class="auth-card">
    <h1>Đặt lại mật khẩu</h1>
    <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
        <label>Email</label>
        <input type="email" th:field="*{email}" readonly>
        <label>OTP</label>
        <input type="text" name="otp" required maxlength="6">
        <label>Mật khẩu mới</label>
        <input type="password" th:field="*{password}" required>
        <label>Xác nhận mật khẩu</label>
        <input type="password" th:field="*{confirmPassword}" required>
        <button type="submit" class="button full mt">Đổi mật khẩu</button>
    </form>
</div>
</body>
</html>
