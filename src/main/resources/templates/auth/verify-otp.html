<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Xác nhận OTP</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="auth-page">
<div class="auth-card">
    <h1>Xác nhận OTP</h1>
    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <div th:if="${#fields.hasErrors('${verifyOtpDTO.*}')}" class="alert error">OTP không hợp lệ hoặc đã hết hạn.</div>
    <form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post">
        <label>Email</label>
        <input type="email" th:field="*{email}" readonly>
        <label>OTP 6 số</label>
        <input type="text" th:field="*{otp}" maxlength="6" required>
        <button type="submit" class="button full">Xác nhận</button>
    </form>
    <form th:action="@{/resend-register-otp}" method="post" class="mt">
        <input type="hidden" name="email" th:value="${verifyOtpDTO.email}">
        <button type="submit" class="button secondary full">Gửi lại OTP</button>
    </form>
    <div class="mt"><a href="/login">Quay lại Login</a></div>
</div>
</body>
</html>
