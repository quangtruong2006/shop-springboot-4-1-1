<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/layout}">
<head><title>Dashboard</title></head>
<body>
<div layout:fragment="content">
    <h1>Dashboard</h1>
    <div class="cards">
        <div class="card">
            <span>Total Users</span>
            <strong th:text="${userCount}">0</strong>
        </div>
        <div class="card">
            <span>Total Products</span>
            <strong th:text="${productCount}">0</strong>
        </div>
    </div>
    <div class="quick-links mt">
        <a href="/products" class="button">Quản lý Products</a>
        <a sec:authorize="hasRole('ADMIN')" href="/users" class="button secondary">Quản lý Users</a>
    </div>
</div>
</body>
</html>
